[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "github-repository-analyzer"
version = "0.1.0"
description = "A tool for analyzing GitHub repositories"
requires-python = ">=3.14"
dependencies = [
    "requests"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.pytest.ini_options]
testpaths = ["tests"]